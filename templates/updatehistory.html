<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background-color: #FAF3E0;">
    {% for i in done %}
    <div class="alert alert-info alert-dismissible fade show text-center" role="alert">
    Treatment Added
</div>
    {% endfor %}
    <div class="d-flex justify-content-center align-items-center vh-100">
<div class="card p-4 shadow rounded" style="width: 300px;">
<form action="/updatehistory/{{patient_data.id}}"  method="POST">
      <h3 style="font-family:Georgia, 'Times New Roman', Times, serif; text-align: center;">Patient Treatment History</h3><br>
    <div class="mb-3">
      <label class="form-label">Disgnosis</label>
      <input type="text" class="form-control" name="dignosis" >
    </div>
    <div class="mb-3">
      <label class="form-label">Prescription</label>
      <input type="text" class="form-control" name="prescription">
    </div>
    <div class="mb-3">
      <label class="form-label">Test Done</label>
      <input type="text" class="form-control" name="testdone"><br>
    <button type="submit" class="btn btn-primary" style="margin-left: 6vw;">Update</button><br>
  </form>
  </div>
  </div>
</body>
</html>
