<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body style="background-color: #FAF3E0;">

  <form >
      <h3 style="font-family:Georgia, 'Times New Roman', Times, serif; text-align: center;">Doctor Details</h3><br>
    <div class="mb-3">
      <label class="form-label"><b>Doctor Name </b>: {{doctor_data.doctor_name}}</label>
    </div>
    <div class="mb-3">
      <label class="form-label"><b>Doctor Department</b> : {{doctor_data.department_name}}</label>
    </div>
    <div class="mb-3">
      <label class="form-label"><b>About</b> : {{doctor_data.doctor_name}} is an experienced and have very deep knowledge about department of {{doctor_data.department_name}}.</label>
    </div>
  </form>
  </div>
  </div>
