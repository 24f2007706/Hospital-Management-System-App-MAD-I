<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assigned Patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background-color: #FAF3E0;">
    <nav class="navbar bg-body-tertiary">
    <div class="container-fluid">
    <a class="navbar-brand">Assigned Patient</a>
    </div>
    </nav>
  {% for i in error %}
  <div class="alert alert-info alert-dismissible fade show text-center" role="alert">
    No Assigned Patients Yet
</div>
  {% endfor %}
    <table class="table table-striped" style="width: 70vw; margin-left: 15vw; margin-top: 5vw;">
    <tr>
    <th>S.no</th>
    <th>Patient</th>
    <th>Patient History</th>
    </tr>
    {% for i in appointments %}
    <tr>
        <td>{{loop.index}}</td>
        <td>{{i.patient_username}}</td>
        <td><a href="/patienthistory/{{i.patient_username}}"><button type="button" class="btn btn-info">View</button></a></td>
    </tr>
    {% endfor %}
    </table>
</body>
</html>
