<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  {% for i in alldata %}
  <div class="alert alert-warning alert-dismissible fade show text-center" role="alert">
    Invalid Credentials / User Is Not Registered.
</div>
  {% endfor %}

  {% for i in emptyfield %}
  <div class="alert alert-warning alert-dismissible fade show text-center" role="alert">
    Field Cannot Be Empty.
</div>
  {% endfor %}

<div class="d-flex justify-content-center align-items-center vh-100">
<div class="card p-4 shadow rounded" style="width: 300px;">
<form action="/login"  method="POST" class="LoginUser" >
    <h3 style="font-family:Georgia, 'Times New Roman', Times, serif; text-align: center;">LOGIN</h3><br>
  <div class="mb-3">
    <label for="Username" class="form-label">Username</label>
    <input type="text" class="form-control" name="Username">
  </div>
  <div class="mb-3">
    <label for="Password" class="form-label">Password</label>
    <input type="password" class="form-control" name="Password">
  </div>
  <button type="submit" class="btn btn-primary" style="margin-left: 6vw; margin-right: 6px;">Login</button><br>
  <a href="/" style="margin-left: 2.5vw; text-decoration: none;">I dont have an accout</a>
</form>
</div>
</div>
</body>
</html>
