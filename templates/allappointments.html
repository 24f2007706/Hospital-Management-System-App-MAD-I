<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registered</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background-color: #FAF3E0;">
  <nav class="navbar bg-body-tertiary">
    <div class="container-fluid">
    <a class="navbar-brand">All Appointments</a>

    <form action="/appointmentsearch" class="d-flex" role="search" method="POST">
       <input class="form-control me-2" type="search" placeholder="Doctor_Username" aria-label="Search" name="searched">
        <button class="btn btn-outline-success" type="submit">Search</button>
    </form>
    </div>
    </nav>

    <div>
<table class="table table-striped" style="width: 70vw; margin-left: 15vw; margin-top: 5vw;">
  {% for i in nodata %}
  <div class="alert alert-info alert-dismissible fade show text-center" role="alert">
    No History Yet
</div>
  {% endfor %}
  <tr>
    <th>S.no</th>
    <th>Doctor Username</th>
    <th>Patient Username</th>
    <th>Date</th>
    <th>Time</th>
    <th>Patient History</th>
  </tr>
{% for i in appointment %}
<tr>
    <td>{{loop.index}}</td>
    <td>{{i.doctor_username}}</td>
    <td>{{i.patient_username}}</td>
    <td>{{i.date}}</td>
    <td>{{i.time}}</td>
    <td><a href="/patienthistory/{{i.patient_username}}"><button type="button" class="btn btn-info">View</button></a></td>
</tr>
{% endfor %}
</table>
</div>

</body>
</html>
